[build]
  command = "node scripts/apply-chat-polish.mjs && node scripts/apply-restaurant-constraint-copy.mjs && node scripts/phase-o-build-gate.mjs && node scripts/phase-p-diagnostic-build.mjs"
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[functions."thongthai-chat"]
  included_files = ["src/data/experiences.ts"]

# Netlify schedules are UTC. 00:00 UTC = 07:00 Asia/Bangkok.
[functions."ops-daily-schedule"]
  schedule = "0 0 * * *"
