[build]
  command = "node scripts/apply-chat-polish.mjs && node scripts/apply-restaurant-constraint-copy.mjs && node scripts/phase-o-build-gate.mjs && node --import tsx scripts/write-semantic-certification-artifact.ts"
  publish = "."
  functions = "netlify/functions"

[build.environment]
  # Phase P closure: One-Mind is now the primary path for supported read-only
  # and task-continuation turns (never propose_action/execute_tool -- see
  # readOnlyCutoverEligibility in _thongthai-one-mind-response.ts and the
  # structural proof in tests/one-mind-never-executes.test.ts that this
  # pipeline never calls a transaction executor). Legacy remains the
  # fallback for domains not yet cut over and for any real transaction.
  THONGTHAI_ONE_MIND_CUTOVER = "1"

  # Phase 5.3 one-shot production-only live semantic certification.
  # The script itself refuses to run unless CONTEXT=production and BRANCH=main.
  RUN_SEMANTIC_CERTIFICATION = "1"

[functions]
  node_bundler = "esbuild"

[functions."thongthai-chat"]
  included_files = ["src/data/experiences.ts"]

# Netlify schedules are UTC. 00:00 UTC = 07:00 Asia/Bangkok.
[functions."ops-daily-schedule"]
  schedule = "0 0 * * *"
