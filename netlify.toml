[build]
  command = "node scripts/apply-isan-boutique-phase1.mjs && node scripts/apply-chat-polish.mjs && node scripts/apply-restaurant-constraint-copy.mjs && node scripts/phase-o-build-gate.mjs && node --import tsx scripts/write-semantic-certification-artifact.ts"
  publish = "."
  functions = "netlify/functions"

[build.environment]
  # Human Conversation Recovery: One-Mind owns shared semantic/context/task
  # decisions on web and LINE. It may create a non-executing action proposal
  # only after explicit commitment and grounded checks; it never calls a
  # booking/order/payment executor. Legacy deterministic executors remain the
  # separate transaction boundary where still supported.
  THONGTHAI_ONE_MIND_CUTOVER = "1"


[functions]
  node_bundler = "esbuild"

[functions."thongthai-chat"]
  included_files = ["src/data/experiences.ts"]

# Netlify schedules are UTC. 00:00 UTC = 07:00 Asia/Bangkok.
[functions."ops-daily-schedule"]
  schedule = "0 0 * * *"


# AI/API cost operations. Schedules are UTC.
# Every 15 minutes: notify only conversations idle 10-45 minutes.
[functions."ai-cost-notify-idle"]
  schedule = "*/15 * * * *"

# 17:05 UTC = 00:05 Asia/Bangkok: report the complete PREVIOUS local day.
[functions."ai-cost-notify-daily"]
  schedule = "5 17 * * *"
