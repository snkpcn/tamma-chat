name: Human Brain Live Semantic Certification

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  live-semantic-baseline:
    if: github.head_ref == 'human-brain/phase5-3-live-semantic-certification-20260926'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      LIVE_EVAL_PROFILE: full
      LIVE_EVAL_MIN_PASS_PCT: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Verify live-provider credentials are available
        run: |
          if [ -z "$GEMINI_API_KEY" ] && [ -z "$OPENAI_API_KEY" ]; then
            echo "LIVE_SEMANTIC_EVAL_NOT_RUN: no GitHub Actions model secret is configured."
            exit 2
          fi
      - name: Run full live semantic baseline
        run: npm run eval:semantic:live
