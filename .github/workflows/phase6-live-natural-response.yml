name: Phase 6 Live Natural Response

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase6-live:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.title, '[run phase6 live]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Require OpenAI credential
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "PHASE6_LIVE_NOT_RUN: OPENAI_API_KEY missing"
            exit 2
          fi
      - name: Run real OpenAI Phase 6 natural-response matrix
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          THONGTHAI_SEMANTIC_REVIEW_MODEL: gpt-5.6-sol
        run: npx tsx scripts/run-phase6-live-natural-response.ts
