name: Phase 3 Formal Cost Stress

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  phase3-cost-stress:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Run formal 20 / 50 / 100-turn stress
        run: npx tsx scripts/run-phase3-cost-stress.ts
