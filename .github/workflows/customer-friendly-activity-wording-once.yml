name: Customer Friendly Activity Wording Once
on:
  push:
    branches: [customer-friendly-activity-wording]
    paths: ['.github/workflows/customer-friendly-activity-wording-once.yml']
permissions:
  contents: write
jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch customer-facing Activity labels
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('netlify/functions/_ops-booking-actions.ts')
          s = p.read_text()
          old = "    units.length ? `ทรัพยากร: ${units.map(unit => unit.name).join(', ')}` : '',\n"
          new = "    units.length ? `${String(units[0]?.metadata?.activity_code ?? '') === 'horse' ? 'น้อง' : String(units[0]?.metadata?.activity_code ?? '') === 'atv' ? 'รถ' : String(units[0]?.metadata?.activity_code ?? '') === 'archery' ? 'ช่องยิง' : 'รายการที่จัด'}: ${units.map(unit => unit.name).join(', ')}` : '',\n"
          if old not in s:
              raise SystemExit('customer resource label marker not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - run: npm ci
      - name: Typecheck booking actions
        run: npx tsc --noEmit --target ES2022 --module commonjs --moduleResolution node --esModuleInterop --skipLibCheck netlify/functions/_ops-booking-actions.ts netlify/functions/_ops-line-ui.ts netlify/functions/line-webhook.ts
      - name: Commit tested wording
        run: |
          rm .github/workflows/customer-friendly-activity-wording-once.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add netlify/functions/_ops-booking-actions.ts .github/workflows/customer-friendly-activity-wording-once.yml
          git commit -m 'Use customer-friendly Activity labels [skip netlify]'
          git push origin customer-friendly-activity-wording
