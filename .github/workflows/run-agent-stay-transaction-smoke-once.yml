name: One-time Thongthai stay transaction smoke

on:
  push:
    branches:
      - test/run-agent-stay-transaction-smoke-20261001

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Run stay transaction turn 1 only
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error             --max-time 45             "https://tamma-chat.netlify.app/.netlify/functions/thongthai-agent-stay-transaction-smoke?turn=1"
