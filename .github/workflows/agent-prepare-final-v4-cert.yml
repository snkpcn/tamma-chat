name: Agent Prepare Final V4 Certification

on:
  push:
    branches:
      - agent-prepare-final-cert

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Run final prepare-only production certification
        run: npx tsx scripts/run-agent-prepare-final-v4-cert.ts
