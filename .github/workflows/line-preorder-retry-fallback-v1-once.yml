name: LINE Preorder Retry Fallback V1 Once
on:
  push:
    branches: [line-preorder-retry-fallback-v1]
    paths:
      - .github/workflows/line-preorder-retry-fallback-v1-once.yml
permissions:
  contents: write
jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/patch_line_preorder_retry_fallback_v1.py
      - run: npm ci
      - name: Typecheck LINE reliability patch
        run: npx tsc --noEmit --target ES2022 --module commonjs --moduleResolution node --esModuleInterop --skipLibCheck netlify/functions/_line-webhook-core.ts netlify/functions/line-webhook.ts netlify/functions/_restaurant-sot.ts netlify/functions/_thongthai-runtime-v3.ts
      - name: Commit tested patch
        run: |
          rm .github/workflows/line-preorder-retry-fallback-v1-once.yml .github/scripts/patch_line_preorder_retry_fallback_v1.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add netlify/functions/_line-webhook-core.ts .github/workflows/line-preorder-retry-fallback-v1-once.yml .github/scripts/patch_line_preorder_retry_fallback_v1.py
          git commit -m 'Retry LINE customer replies safely after transient failures [skip netlify]'
          git push origin line-preorder-retry-fallback-v1
