name: Phase 4 Final Production Boundary Cert

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  cert:
    if: contains(github.event.pull_request.title, '[run p4 final prod]')
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Run final safe-only Phase 4 boundary proof against Production
        env:
          THONGTHAI_PRODUCTION_URL: https://tamma-chat.netlify.app/.netlify/functions/thongthai-chat
        run: npx tsx scripts/run-phase4-final-production-boundary-cert.ts
