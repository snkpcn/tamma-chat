name: Cross-channel Agent 10 smoke

on:
  push:
    branches:
      - agent-cross-channel-smoke-10

jobs:
  line:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: LINE read-only canary
        env:
          PHASE7_GUEST_ID: 28913a00-8d7c-5803-a03c-d03f9c8a8c23
          PHASE7_LIMIT: "3"
          PHASE7_CHANNEL: line
        run: npm run certify:phase7:production

  facebook:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Facebook read-only canary
        env:
          PHASE7_GUEST_ID: 97cc95ab-79cd-5aca-a939-99ebf6fdf89d
          PHASE7_LIMIT: "3"
          PHASE7_CHANNEL: facebook
        run: npm run certify:phase7:production
