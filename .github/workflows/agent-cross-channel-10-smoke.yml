name: Cross-channel Agent 10 smoke

on:
  push:
    branches:
      - agent-cross-channel-smoke-10

jobs:
  line:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: LINE read-only canary
        env:
          PHASE7_GUEST_ID: 83da520f-99ad-590c-bb5c-4fcd4af179b4
          PHASE7_LIMIT: "3"
          PHASE7_CHANNEL: line
        run: npm run certify:phase7:production

  facebook:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Facebook read-only canary
        env:
          PHASE7_GUEST_ID: 41bd0ae4-e333-5962-8b0a-326ade920295
          PHASE7_LIMIT: "3"
          PHASE7_CHANNEL: facebook
        run: npm run certify:phase7:production
