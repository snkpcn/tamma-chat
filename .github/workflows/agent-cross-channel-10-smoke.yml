name: Cross-channel Agent 10 smoke

on:
  push:
    branches:
      - agent-cross-channel-smoke-10

jobs:
  line:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: LINE read-only canary
        env:
          PHASE7_GUEST_ID: 2b5d9055-59b8-5f55-b721-38407ebb855e
          PHASE7_LIMIT: "3"
          PHASE7_CHANNEL: line
        run: npm run certify:phase7:production

  facebook:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Facebook read-only canary
        env:
          PHASE7_GUEST_ID: 44a29788-76af-55c3-aac9-2322c6b2c8a0
          PHASE7_LIMIT: "3"
          PHASE7_CHANNEL: facebook
        run: npm run certify:phase7:production
