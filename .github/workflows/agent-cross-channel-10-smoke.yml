name: Cross-channel Agent 10 smoke

on:
  push:
    branches:
      - agent-cross-channel-smoke-10

jobs:
  line:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: LINE read-only canary
        env:
          PHASE7_GUEST_ID: a343e7aa-084b-5928-8557-d3c5b7bba9ec
          PHASE7_LIMIT: "3"
          PHASE7_CHANNEL: line
        run: npm run certify:phase7:production

  facebook:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Facebook read-only canary
        env:
          PHASE7_GUEST_ID: cc57a947-1b16-52a2-97c1-9b162bdb8cd0
          PHASE7_LIMIT: "3"
          PHASE7_CHANNEL: facebook
        run: npm run certify:phase7:production
