name: Restaurant Duplicate Message V1 Once
on:
  push:
    branches: [restaurant-duplicate-message-v1]
    paths:
      - .github/workflows/restaurant-duplicate-message-v1-once.yml
permissions:
  contents: write
jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/patch_restaurant_duplicate_message_v1.py
      - run: npm ci
      - name: Typecheck duplicate response patch
        run: npx tsc --noEmit --target ES2022 --module commonjs --moduleResolution node --esModuleInterop --skipLibCheck netlify/functions/thongthai-chat.ts netlify/functions/_thongthai-brain-v3.ts
      - name: Commit tested patch
        run: |
          rm .github/workflows/restaurant-duplicate-message-v1-once.yml .github/scripts/patch_restaurant_duplicate_message_v1.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add netlify/functions/thongthai-chat.ts netlify/functions/_thongthai-brain-v3.ts .github/workflows/restaurant-duplicate-message-v1-once.yml .github/scripts/patch_restaurant_duplicate_message_v1.py
          git commit -m 'Tell customers when restaurant preorder is a duplicate [skip netlify]'
          git push origin restaurant-duplicate-message-v1
