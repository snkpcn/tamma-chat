name: Phase O final Netlify rebuild

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/phase-o-final-netlify-rebuild.yml

permissions:
  contents: read

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SITE_ID: 8c1f4d60-68c9-4940-9152-89e9c967e22c
      TOKEN_A: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      TOKEN_B: ${{ secrets.NETLIFY_ACCESS_TOKEN }}
      TOKEN_C: ${{ secrets.NETLIFY_TOKEN }}
    steps:
      - name: Trigger production build on existing Netlify site
        shell: bash
        run: |
          set -euo pipefail
          TOKEN="${TOKEN_A:-}"
          [ -n "$TOKEN" ] || TOKEN="${TOKEN_B:-}"
          [ -n "$TOKEN" ] || TOKEN="${TOKEN_C:-}"
          if [ -z "$TOKEN" ]; then
            echo "No supported Netlify token secret is configured in this GitHub repository."
            exit 2
          fi
          RESP=$(curl -fsS -X POST \
            -H "Authorization: Bearer $TOKEN" \
            "https://api.netlify.com/api/v1/sites/$SITE_ID/builds")
          echo "$RESP" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const j=JSON.parse(s);console.log(JSON.stringify({buildId:j.id,state:j.state||null}))})"

      - name: Wait for current main to become the ready production deploy
        shell: bash
        run: |
          set -euo pipefail
          TOKEN="${TOKEN_A:-}"
          [ -n "$TOKEN" ] || TOKEN="${TOKEN_B:-}"
          [ -n "$TOKEN" ] || TOKEN="${TOKEN_C:-}"
          TARGET=$(curl -fsS https://api.github.com/repos/snkpcn/tamma-chat/commits/main | node -pe "JSON.parse(fs.readFileSync(0,'utf8')).sha")
          echo "target_main=$TARGET"
          for N in $(seq 1 90); do
            JSON=$(curl -fsS -H "Authorization: Bearer $TOKEN" "https://api.netlify.com/api/v1/sites/$SITE_ID/deploys?per_page=8")
            LINE=$(printf '%s' "$JSON" | TARGET="$TARGET" node -e "
              const fs=require('fs'); const a=JSON.parse(fs.readFileSync(0,'utf8')); const t=process.env.TARGET;
              const d=a.find(x=>x.commit_ref===t);
              if(d) process.stdout.write(JSON.stringify({id:d.id,state:d.state,commit:d.commit_ref,error:d.error_message||null}));
            ")
            if [ -n "$LINE" ]; then
              echo "$LINE"
              STATE=$(printf '%s' "$LINE" | node -pe "JSON.parse(fs.readFileSync(0,'utf8')).state")
              if [ "$STATE" = "ready" ]; then exit 0; fi
              if [ "$STATE" = "error" ]; then exit 1; fi
            fi
            sleep 10
          done
          echo "Timed out waiting for production deploy"
          exit 1
