name: Phase 1 Live Language Acceptance

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-openai-language:
    # Paid certification is opt-in while a PR is under development. Add
    # "[run live]" to the PR title for the frozen/final checkpoint, or use
    # workflow_dispatch. Ordinary commits must not burn OpenAI credit.
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.title, '[run live]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Require OpenAI acceptance credential
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "PHASE1_LIVE_NOT_RUN: repository OPENAI_API_KEY secret is not configured."
            exit 2
          fi
      - name: Run real OpenAI regression acceptance
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          THONGTHAI_SEMANTIC_MODEL: gpt-5.6-terra
          THONGTHAI_SEMANTIC_REVIEW_MODEL: gpt-5.6-sol
        run: npm run eval:phase1:live
      - name: Run frozen hidden open-world holdout
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          THONGTHAI_SEMANTIC_MODEL: gpt-5.6-terra
          THONGTHAI_SEMANTIC_REVIEW_MODEL: gpt-5.6-sol
        run: npx tsx scripts/run-phase1-hidden-holdout.ts
      - name: Run Phase 6 live multi-turn semantic acceptance
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          THONGTHAI_SEMANTIC_MODEL: gpt-5.6-terra
          THONGTHAI_SEMANTIC_REVIEW_MODEL: gpt-5.6-sol
        run: npx tsx scripts/run-phase6-live-multiturn.ts
      - name: Run real LINE 16-turn human conversation acceptance
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          THONGTHAI_SEMANTIC_MODEL: gpt-5.6-terra
          THONGTHAI_SEMANTIC_REVIEW_MODEL: gpt-5.6-sol
        run: npx tsx scripts/run-real-line-16-turn-live-acceptance.ts
