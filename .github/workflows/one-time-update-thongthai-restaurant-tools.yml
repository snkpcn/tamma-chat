name: One-time update Thongthai restaurant tools

on:
  push:
    branches:
      - ops/update-thongthai-restaurant-tools-20261001

permissions:
  contents: read

jobs:
  update-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Update saved Thongthai Agent
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          THONGTHAI_AGENT_MODEL: gpt-5.6-terra
        run: npm run agent:thongthai:staging
