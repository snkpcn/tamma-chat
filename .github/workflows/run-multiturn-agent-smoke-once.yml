name: One-time multi-turn Thongthai Agent smoke

on:
  push:
    branches:
      - test/run-multiturn-agent-smoke-20261001

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Invoke four fixed synthetic Agent turns sequentially
        run: |
          set -euo pipefail
          for turn in 1 2 3 4; do
            echo "===== TURN $turn ====="
            curl --fail-with-body --silent --show-error               --max-time 45               "https://tamma-chat.netlify.app/.netlify/functions/thongthai-agent-multiturn-smoke?turn=$turn"
            echo
          done
