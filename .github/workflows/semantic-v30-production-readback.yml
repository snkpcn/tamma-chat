name: Semantic v30 production artifact readback

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  readback:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch production semantic certification artifact
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 3 --retry-delay 2             -H 'Cache-Control: no-cache'             'https://tamma-chat.netlify.app/semantic-certification-result.json'             -o /tmp/semantic-certification-result.json
          node <<'NODE'
          const fs = require('fs');
          const artifact = JSON.parse(fs.readFileSync('/tmp/semantic-certification-result.json', 'utf8'));
          console.log('SEMANTIC_V30_ARTIFACT=' + JSON.stringify(artifact));
          NODE
