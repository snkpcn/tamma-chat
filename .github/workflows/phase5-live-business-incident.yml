name: Phase 5 Live Business Incident

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase5-live:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.title, '[run phase5 live]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Require OpenAI credential
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "PHASE5_LIVE_NOT_RUN: OPENAI_API_KEY missing"
            exit 2
          fi
      - name: Run real OpenAI Phase 5 business/incident matrix
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          THONGTHAI_SEMANTIC_MODEL: gpt-5.6-terra
          THONGTHAI_SEMANTIC_REVIEW_MODEL: gpt-5.6-sol
        run: npx tsx scripts/run-phase5-live-business-incident.ts
