name: Export source snapshot once

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: tamma-chat-source
          path: |
            .
            !.git/**
          include-hidden-files: false
          retention-days: 1
          if-no-files-found: error
