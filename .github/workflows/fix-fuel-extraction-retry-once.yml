name: Fix fuel extraction retry once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-fuel-extraction-retry-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - name: Patch fuel receipt extraction
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('netlify/functions/_ops-fuel-receipts.ts')
          s = p.read_text()
          old = """async function extractReceipt(bytes: Buffer, mimeType: string): Promise<ReceiptExtraction> {\n  try {\n    return await extractWithGemini(bytes, mimeType);\n  } catch (geminiError) {\n    console.error('LINE_FUEL_RECEIPT_GEMINI_ERROR', geminiError instanceof Error ? geminiError.message.slice(0, 180) : 'unknown');\n    return extractWithOpenAI(bytes, mimeType);\n  }\n}\n"""
          new = """async function extractReceipt(bytes: Buffer, mimeType: string): Promise<ReceiptExtraction> {\n  let geminiLastError: unknown = null;\n  for (let attempt = 1; attempt <= 2; attempt += 1) {\n    try {\n      return await extractWithGemini(bytes, mimeType);\n    } catch (geminiError) {\n      geminiLastError = geminiError;\n      console.error(\n        'LINE_FUEL_RECEIPT_GEMINI_ERROR',\n        `attempt=${attempt}`,\n        geminiError instanceof Error ? geminiError.message.slice(0, 180) : 'unknown',\n      );\n      if (attempt < 2) await new Promise(resolve => setTimeout(resolve, 450));\n    }\n  }\n  try {\n    return await extractWithOpenAI(bytes, mimeType);\n  } catch (openaiError) {\n    console.error(\n      'LINE_FUEL_RECEIPT_OPENAI_ERROR',\n      openaiError instanceof Error ? openaiError.message.slice(0, 180) : 'unknown',\n      geminiLastError instanceof Error ? `gemini=${geminiLastError.message.slice(0, 120)}` : '',\n    );\n    throw new Error('receipt_extraction_unavailable');\n  }\n}\n"""
          if old not in s:
            raise SystemExit('extractReceipt block not found')
          s = s.replace(old, new, 1)
          old_msg = """    return 'ทองไทยอ่านสลิปไม่สำเร็จครับ ลองถ่ายให้เห็นวันที่ จำนวนลิตร และยอดเงินชัด ๆ แล้วส่งใหม่อีกครั้ง';"""
          new_msg = """    return 'ระบบอ่านสลิปขัดข้องชั่วคราวครับ — ยังไม่ได้บันทึกอะไรลงหลังบ้าน รูปเดิมใช้ได้ ลองส่งรูปเดิมอีกครั้งได้เลย';"""
          if old_msg not in s:
            raise SystemExit('extraction error message not found')
          s = s.replace(old_msg, new_msg, 1)
          p.write_text(s)
          PY
      - name: Remove one-time workflow
        run: rm .github/workflows/fix-fuel-extraction-retry-once.yml
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add netlify/functions/_ops-fuel-receipts.ts .github/workflows/fix-fuel-extraction-retry-once.yml
          git commit -m "Retry fuel receipt extraction and keep failures safe"
          git push origin main
