name: WW12 Production Deploy

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  deploy:
    if: github.head_ref == 'ops/ww12-production-deploy'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Verify exact main SHA
        run: |
          echo "MAIN_SHA=$(git rev-parse HEAD)"
      - name: Require Netlify auth
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: |
          if [ -z "$NETLIFY_AUTH_TOKEN" ]; then
            echo "NETLIFY_AUTH_TOKEN_MISSING"
            exit 2
          fi
      - name: Deploy exact main to Netlify production
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: |
          npx -y netlify-cli@latest deploy --build --prod \
            --site 8c1f4d60-68c9-4940-9152-89e9c967e22c \
            --auth "$NETLIFY_AUTH_TOKEN"
