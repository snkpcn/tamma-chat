name: Messenger Production Hotfix Certification

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  messenger-production-cert:
    if: contains(github.event.pull_request.title, '[run messenger prod]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Run real production Messenger-core certification
        env:
          THONGTHAI_PRODUCTION_URL: https://tamma-chat.netlify.app/.netlify/functions/thongthai-chat
        run: npx tsx scripts/run-messenger-production-certification.ts
