name: Probe Preview Brain Status

on:
  push:
    branches:
      - ops/semantic-cert-readback-20260926

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch preview brain status
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            https://deploy-preview-122--tamma-chat.netlify.app/.netlify/functions/thongthai-brain-status \
            -o brain-status.json
          node -e "const x=require('./brain-status.json'); console.log(JSON.stringify(x.environment,null,2))"
      - uses: actions/upload-artifact@v4
        with:
          name: preview-brain-status
          path: brain-status.json
          if-no-files-found: error
