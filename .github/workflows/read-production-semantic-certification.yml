name: Read Live Semantic Certification

on:
  push:
    branches:
      - ops/semantic-cert-readback-20260926

permissions:
  contents: read

jobs:
  fetch-certification:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Run full live semantic certification through preview-only harness
        env:
          CERT_URL: https://deploy-preview-122--tamma-chat.netlify.app/.netlify/functions/thongthai-semantic-certification-preview
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const base=process.env.CERT_URL;
          const batches=[];
          let start=0;
          let total=Number.POSITIVE_INFINITY;
          const limit=5;

          async function getJson(url){
            let last;
            for(let attempt=1; attempt<=4; attempt++){
              try{
                const r=await fetch(url,{headers:{'accept':'application/json'}});
                const text=await r.text();
                if(!r.ok) throw new Error('HTTP '+r.status+' '+text.slice(0,200));
                return JSON.parse(text);
              }catch(error){
                last=error;
                if(attempt<4) await new Promise(resolve=>setTimeout(resolve,2000*attempt));
              }
            }
            throw last;
          }

          (async()=>{
            while(start<total){
              const url=base+'?profile=full&start='+start+'&limit='+limit;
              const batch=await getJson(url);
              if(batch.kind!=='LIVE_MODEL_SEMANTIC_CERTIFICATION') throw new Error('unexpected payload');
              batches.push(batch);
              total=batch.totalCorpusCases;
              if(!batch.evaluated) break;
              console.log('batch',start,'evaluated',batch.evaluated,'pass',batch.pass,'failed',batch.failed);
              start+=batch.evaluated;
            }

            const evaluated=batches.reduce((n,b)=>n+b.evaluated,0);
            const pass=batches.reduce((n,b)=>n+b.pass,0);
            const failures=batches.flatMap(b=>b.failures||[]);
            const result={
              kind:'LIVE_MODEL_SEMANTIC_CERTIFICATION',
              source:'netlify-deploy-preview-122',
              totalCorpusCases:total,
              evaluated,
              pass,
              failed:failures.length,
              passPct:evaluated?Number((pass/evaluated*100).toFixed(2)):0,
              failures,
            };
            fs.writeFileSync('semantic-certification-result.json',JSON.stringify(result,null,2));
            console.log('FINAL',JSON.stringify({
              totalCorpusCases:result.totalCorpusCases,
              evaluated:result.evaluated,
              pass:result.pass,
              failed:result.failed,
              passPct:result.passPct,
            }));
          })().catch(error=>{console.error(error);process.exit(1);});
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: semantic-certification-result
          path: semantic-certification-result.json
          if-no-files-found: error
