name: Probe Preview Semantic Provider

on:
  push:
    branches:
      - ops/semantic-cert-readback-20260926

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch safe semantic provider probe
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            "https://deploy-preview-122--tamma-chat.netlify.app/.netlify/functions/thongthai-semantic-certification-preview?probe=1" \
            -o semantic-provider-probe.json
          cat semantic-provider-probe.json
      - uses: actions/upload-artifact@v4
        with:
          name: semantic-provider-probe
          path: semantic-provider-probe.json
          if-no-files-found: error
