name: WW10 Netlify Deploy Kit

# WW10 deploy relay v2: PR-only GitHub OIDC via Supabase

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact WW10 main
        uses: actions/checkout@v4
        with:
          ref: 191c55a703d6d24ca4be4a55974eecfdbd6240cc
      - name: Package exact source
        run: |
          tar --exclude=.git --exclude=node_modules -czf /tmp/tamma-chat-ww10-source.tgz .
      - name: Install Netlify MCP CLI locally
        run: |
          mkdir -p /tmp/netlify-mcp
          npm install --prefix /tmp/netlify-mcp @netlify/mcp@latest
          tar -czf /tmp/netlify-mcp.tgz -C /tmp netlify-mcp
      - name: Upload source
        uses: actions/upload-artifact@v4
        with:
          name: tamma-chat-ww10-source
          path: /tmp/tamma-chat-ww10-source.tgz
          if-no-files-found: error
          retention-days: 1
      - name: Upload Netlify CLI
        uses: actions/upload-artifact@v4
        with:
          name: ww10-netlify-mcp
          path: /tmp/netlify-mcp.tgz
          if-no-files-found: error
          retention-days: 1
      - name: Deploy exact main through OIDC-gated relay
        env:
          PREVIEW_TOKEN_URL: https://upaokrprawzhgzeqsdke.supabase.co/functions/v1/ww10-deploy-relay
        run: |
          set -euo pipefail
          OIDC_JSON="$(curl -fsSL -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=ww10-netlify-deploy")"
          OIDC_TOKEN="$(node -e 'const j=JSON.parse(process.argv[1]); process.stdout.write(j.value||"")' "$OIDC_JSON")"
          test -n "$OIDC_TOKEN"
          PROXY=""
          for i in $(seq 1 60); do
            set +e
            VALUE="$(curl -fsS -X POST -H "Authorization: Bearer $OIDC_TOKEN" "$PREVIEW_TOKEN_URL" 2>/dev/null)"
            RC=$?
            set -e
            if [ "$RC" -eq 0 ] && [[ "$VALUE" == https://netlify-mcp.netlify.app/proxy/* ]]; then
              PROXY="$VALUE"
              break
            fi
            sleep 5
          done
          test -n "$PROXY"
          echo "::add-mask::$PROXY"
          npx -y @netlify/mcp@latest --site-id 8c1f4d60-68c9-4940-9152-89e9c967e22c --proxy-path "$PROXY"
