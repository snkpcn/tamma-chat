name: WW10 Netlify Deploy Kit

# WW10 deploy relay v2: PR-only GitHub OIDC via Supabase

on:
  push:
    branches:
      - 'ops/ww10-netlify-deploy-kit'
  pull_request:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact WW10 main
        uses: actions/checkout@v4
        with:
          ref: 8fec3a15e3c2452e6a7d88eaf5584902ba6f9d42
      - name: Inject production-only build stage diagnostics
        run: |
          cat > scripts/netlify-build-gate.mjs <<'EOF'
          import { spawnSync } from 'node:child_process';

          const NODE = process.execPath;
          const marker = 'ww10-manual-prod-diagnostic-20261003';
          const steps = [
            ['apply-isan-boutique-phase1', NODE, ['scripts/apply-isan-boutique-phase1.mjs']],
            ['public-i18n-build-gate', NODE, ['scripts/public-i18n-build-gate.mjs']],
            ['apply-chat-polish', NODE, ['scripts/apply-chat-polish.mjs']],
            ['apply-restaurant-constraint-copy', NODE, ['scripts/apply-restaurant-constraint-copy.mjs']],
            ['phase-o-build-gate', NODE, ['scripts/phase-o-build-gate.mjs']],
            ['audit-preww', 'npm', ['run', 'audit:preww']],
            ['audit-ww0', 'npm', ['run', 'audit:ww0']],
            ['audit-ww1', 'npm', ['run', 'audit:ww1']],
            ['audit-ww2', 'npm', ['run', 'audit:ww2']],
            ['audit-ww3', 'npm', ['run', 'audit:ww3']],
            ['audit-ww4', 'npm', ['run', 'audit:ww4']],
            ['audit-ww5', 'npm', ['run', 'audit:ww5']],
            ['audit-ww6', 'npm', ['run', 'audit:ww6']],
            ['audit-ww7', 'npm', ['run', 'audit:ww7']],
            ['audit-ww8', 'npm', ['run', 'audit:ww8']],
            ['audit-ww9', 'npm', ['run', 'audit:ww9']],
            ['audit-ww10', 'npm', ['run', 'audit:ww10']],
            ['semantic-certification-artifact', NODE, ['--import', 'tsx', 'scripts/write-semantic-certification-artifact.ts']],
          ];

          async function report(code, name, status, childExit = null) {
            const url = process.env.SUPABASE_URL?.replace(/\/$/, '');
            const key = process.env.SUPABASE_SERVICE_ROLE_KEY;
            if (!url || !key) return;
            try {
              await fetch(url + '/rest/v1/ww10_build_stage_diagnostics', {
                method: 'POST',
                headers: {
                  apikey: key,
                  Authorization: 'Bearer ' + key,
                  'Content-Type': 'application/json',
                  Prefer: 'return=minimal',
                },
                body: JSON.stringify({
                  deploy_marker: marker,
                  stage_code: code,
                  stage_name: name,
                  status,
                  child_exit: childExit,
                  netlify_context: process.env.CONTEXT ?? null,
                }),
              });
            } catch {}
          }

          await report(10, 'runner-started', 'start');
          for (let index = 0; index < steps.length; index += 1) {
            const [name, command, args] = steps[index];
            const code = 21 + index;
            await report(code, name, 'start');
            const result = spawnSync(command, args, {
              cwd: process.cwd(),
              env: process.env,
              stdio: 'inherit',
            });
            if (result.error || result.status !== 0) {
              await report(code, name, 'fail', result.status ?? null);
              process.exit(code);
            }
            await report(code, name, 'ok', 0);
          }
          await report(99, 'runner-completed', 'ok', 0);
          EOF
      - name: Package exact source
        run: |
          tar --exclude=.git --exclude=node_modules -czf /tmp/tamma-chat-ww10-source.tgz .
      - name: Install Netlify MCP CLI locally
        run: |
          mkdir -p /tmp/netlify-mcp
          npm install --prefix /tmp/netlify-mcp @netlify/mcp@latest
          tar -czf /tmp/netlify-mcp.tgz -C /tmp netlify-mcp
      - name: Upload source
        uses: actions/upload-artifact@v4
        with:
          name: tamma-chat-ww10-source
          path: /tmp/tamma-chat-ww10-source.tgz
          if-no-files-found: error
          retention-days: 1
      - name: Upload Netlify CLI
        uses: actions/upload-artifact@v4
        with:
          name: ww10-netlify-mcp
          path: /tmp/netlify-mcp.tgz
          if-no-files-found: error
          retention-days: 1
      - name: Deploy exact main through OIDC-gated relay
        env:
          PREVIEW_TOKEN_URL: https://upaokrprawzhgzeqsdke.supabase.co/functions/v1/ww10-deploy-relay
        run: |
          set -euo pipefail
          OIDC_JSON="$(curl -fsSL -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=ww10-netlify-deploy")"
          OIDC_TOKEN="$(node -e 'const j=JSON.parse(process.argv[1]); process.stdout.write(j.value||"")' "$OIDC_JSON")"
          test -n "$OIDC_TOKEN"
          PROXY=""
          for i in $(seq 1 60); do
            set +e
            VALUE="$(curl -fsS -X POST -H "Authorization: Bearer $OIDC_TOKEN" "$PREVIEW_TOKEN_URL" 2>/dev/null)"
            RC=$?
            set -e
            if [ "$RC" -eq 0 ] && [[ "$VALUE" == https://netlify-mcp.netlify.app/proxy/* ]]; then
              PROXY="$VALUE"
              break
            fi
            sleep 5
          done
          test -n "$PROXY"
          echo "::add-mask::$PROXY"
          npx -y @netlify/mcp@latest --site-id 8c1f4d60-68c9-4940-9152-89e9c967e22c --proxy-path "$PROXY"
