name: Phase 7 Final Production Certification

# Human Core final certification: exercises the REAL deployed Netlify
# production customer endpoint from a runner with real network access
# (this repository's own sandbox/dev environments may have none). Manual
# trigger by default. A deliberately titled certification PR may also invoke
# the gate after its implementation commit is already deployed to production.
#
# Safety contract: the unchanged Phase 7 conversation is read-only and now
# explicitly enters environment=TEST for synthetic telemetry/state. It never
# authorizes a transaction, and any accidental future synthetic write is kept
# out of LIVE business records by the server-side TEST boundary.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      production_url:
        description: 'Production endpoint to test (defaults to the real deployed URL)'
        required: false
        default: 'https://tamma-chat.netlify.app/.netlify/functions/thongthai-chat'

permissions:
  contents: read

jobs:
  production-smoke:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.title, '[run phase7 prod]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Run Phase 7 final production certification (read-only, no transactions)
        env:
          THONGTHAI_PRODUCTION_URL: ${{ inputs.production_url || 'https://tamma-chat.netlify.app/.netlify/functions/thongthai-chat' }}
        run: npx tsx scripts/run-phase7-production-certification.ts
