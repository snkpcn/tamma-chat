name: Staff Flex UX Typecheck
on:
  push:
    branches:
      - staff-flex-ux
    paths:
      - .github/workflows/staff-flex-ux-check2.yml
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staff-flex-ux
      - run: npm ci
      - run: npx tsc --noEmit --target ES2022 --module commonjs --moduleResolution node --esModuleInterop --skipLibCheck netlify/functions/_ops-line-ui.ts netlify/functions/_ops-booking-notify-flex.ts netlify/functions/line-webhook.ts netlify/functions/ops-notify.ts netlify/functions/_ops-booking-actions.ts
# rerun after explicit HandlerResponse fix
