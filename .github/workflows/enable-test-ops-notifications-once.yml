name: Enable labeled test ops notifications once
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/enable-test-ops-notifications-once.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Patch notification handler
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('netlify/functions/_ops-notifications.ts')
          s = p.read_text()
          replacements = [
            ("if (!booking || booking.environment !== 'live') return 'ignored';", "if (!booking || !['live', 'test'].includes(booking.environment)) return 'ignored';\n  const environmentPrefix = booking.environment === 'test' ? '🧪 TEST — ' : '';"),
            ("`🔔 งานใหม่ — ${TEAM_LABELS[teamCode]}`", "`${environmentPrefix}🔔 งานใหม่ — ${TEAM_LABELS[teamCode]}`"),
            ("if (!inquiry || inquiry.environment !== 'live') return 'ignored';", "if (!inquiry || !['live', 'test'].includes(inquiry.environment)) return 'ignored';\n  const environmentPrefix = inquiry.environment === 'test' ? '🧪 TEST — ' : '';"),
            ("`☕ งานใหม่ — ${TEAM_LABELS.cafe}`", "`${environmentPrefix}☕ งานใหม่ — ${TEAM_LABELS.cafe}`"),
            ("if (!order || order.environment !== 'live') return 'ignored';", "if (!order || !['live', 'test'].includes(order.environment)) return 'ignored';\n  const environmentPrefix = order.environment === 'test' ? '🧪 TEST — ' : '';"),
            ("`🛍️ ออเดอร์ใหม่ — ${TEAM_LABELS.otop}`", "`${environmentPrefix}🛍️ ออเดอร์ใหม่ — ${TEAM_LABELS.otop}`"),
          ]
          for old, new in replacements:
              if old not in s:
                  raise SystemExit(f'missing expected source: {old}')
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          rm .github/workflows/enable-test-ops-notifications-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add netlify/functions/_ops-notifications.ts .github/workflows/enable-test-ops-notifications-once.yml
          git commit -m 'Allow clearly labeled test ops notifications'
          git push
