name: Update Thongthai Production Fast Prepare

on:
  push:
    branches:
      - agent-update-production-fast-prepare

permissions:
  contents: read

jobs:
  update-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Require OpenAI credential
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "OPENAI_API_KEY secret is not configured."
            exit 2
          fi
      - name: Update Thongthai-Production saved Agent
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          THONGTHAI_AGENT_MODEL: gpt-5.6-terra
        run: npm run agent:thongthai:production
