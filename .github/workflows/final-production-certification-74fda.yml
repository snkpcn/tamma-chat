name: Final Production Certification 74fda

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/final-production-certification-74fda.yml'

permissions:
  contents: read

jobs:
  production-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 74fda2b41cba900e8e30eefc37f63a1fe73da263
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Verify exact target SHA
        run: test "$(git rev-parse HEAD)" = "74fda2b41cba900e8e30eefc37f63a1fe73da263"
      - name: Run semantic production smoke
        env:
          THONGTHAI_PRODUCTION_URL: https://tamma-chat.netlify.app/.netlify/functions/thongthai-chat
        run: npx tsx scripts/run-production-smoke.ts

  line-transport-certification:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 74fda2b41cba900e8e30eefc37f63a1fe73da263
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Verify exact target SHA
        run: test "$(git rev-parse HEAD)" = "74fda2b41cba900e8e30eefc37f63a1fe73da263"
      - name: Run real LINE HTTPS transport certification
        env:
          LINE_CHANNEL_SECRET: ${{ secrets.LINE_CHANNEL_SECRET }}
          LINE_WEBHOOK_URL: https://tamma-chat.netlify.app/.netlify/functions/line-webhook
        run: npx tsx scripts/run-line-transport-certification.ts
