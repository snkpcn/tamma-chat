name: Voice and location hotfix diagnostics
on:
  push:
    branches: [hotfix/thongthai-voice-location-20261001]
permissions:
  contents: read
jobs:
  source-context:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package tracked application source (no environment or credentials)
        run: |
          git ls-files | grep -E '^(netlify/|src/|tests/|scripts/|supabase/|\.github/)|\.(json|toml|md|html)$' > /tmp/source-files.txt
          tar -czf /tmp/thongthai-source-context.tar.gz -T /tmp/source-files.txt
      - uses: actions/upload-artifact@v4
        with:
          name: thongthai-source-context
          path: /tmp/thongthai-source-context.tar.gz
          retention-days: 1
