name: LINE special request
on:
  push:
    branches: [special-request-booking]
    paths:
      - .github/workflows/line-special-request.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: special-request-booking
          fetch-depth: 0
      - name: Patch LINE booking flow
        run: python3 scripts/patch_line_special_request.py
      - name: Validate markers
        run: |
          grep -q "awaiting_special_request" netlify/functions/_operations-db.ts
          grep -q "special_request" netlify/functions/_operations-db.ts
          grep -q "note: specialRequest" netlify/functions/_operations-db.ts
          grep -q "คำขอพิเศษ" netlify/functions/_operations-db.ts
      - name: Validate TypeScript
        run: npx -y esbuild@latest netlify/functions/_operations-db.ts --bundle --platform=node --format=esm --outfile=/tmp/operations-db.mjs
      - name: Commit patch and cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/line-special-request.yml scripts/patch_line_special_request.py
          git add netlify/functions/_operations-db.ts
          git commit -m "Capture LINE stay special requests with booking"
          git push origin special-request-booking
