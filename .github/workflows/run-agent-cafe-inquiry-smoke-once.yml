name: One-time Thongthai cafe inquiry smoke

on:
  push:
    branches:
      - test/run-agent-cafe-inquiry-smoke-20261001

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Run cafe inquiry turn 2 only
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error             --max-time 45             "https://tamma-chat.netlify.app/.netlify/functions/thongthai-agent-cafe-inquiry-smoke?turn=2"
