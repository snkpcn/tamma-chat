name: Messenger Local Production Certification

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  certify:
    if: contains(github.event.pull_request.title, '[run messenger local prod]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx tsx scripts/run-messenger-local-production-certification.ts
