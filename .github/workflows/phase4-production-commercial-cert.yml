name: Phase 4 Production Commercial Cert

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  cert:
    if: contains(github.event.pull_request.title, '[run p4 prod cert]')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Run targeted Phase 4 production commercial-boundary proof
        env:
          THONGTHAI_PRODUCTION_URL: https://tamma-chat.netlify.app/.netlify/functions/thongthai-chat
        run: npx tsx scripts/run-phase4-production-commercial-cert.ts
