name: Staff Flex UX Check
on:
  push:
    branches: [staff-flex-ux]
    paths: ['.github/workflows/staff-flex-ux-check.yml']
permissions:
  contents: write
jobs:
  patch-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staff-flex-ux
      - name: Patch booking notifications to Flex cards
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('netlify/functions/_ops-notifications.ts')
          s=p.read_text()
          old="import { handleBookingOpsCommand } from './_ops-booking-actions';\n"
          new=old+"import { buildStaffBookingFlexMessage, type LineMessage } from './_ops-line-ui';\n"
          if "buildStaffBookingFlexMessage" not in s:
              if old not in s: raise SystemExit('import marker missing')
              s=s.replace(old,new,1)

          old_push="""async function linePush(targetId: string, text: string): Promise<void> {
  const accessToken = process.env.LINE_CHANNEL_ACCESS_TOKEN;
  if (!accessToken) throw new Error('LINE_CHANNEL_ACCESS_TOKEN is not configured');
  const response = await fetch(LINE_PUSH_ENDPOINT, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      Authorization: `Bearer ${accessToken}`,
    },
    body: JSON.stringify({ to: targetId, messages: [{ type: 'text', text: text.slice(0, 4900) }] }),
  });
  if (!response.ok) {
    const body = await response.text().catch(() => '');
    throw new Error(`LINE push failed ${response.status}: ${body.slice(0, 260)}`);
  }
}
"""
          new_push="""async function linePush(targetId: string, content: string | LineMessage[]): Promise<void> {
  const accessToken = process.env.LINE_CHANNEL_ACCESS_TOKEN;
  if (!accessToken) throw new Error('LINE_CHANNEL_ACCESS_TOKEN is not configured');
  const messages: LineMessage[] = typeof content === 'string'
    ? [{ type: 'text', text: content.slice(0, 4900) }]
    : content.slice(0, 5);
  const response = await fetch(LINE_PUSH_ENDPOINT, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      Authorization: `Bearer ${accessToken}`,
    },
    body: JSON.stringify({ to: targetId, messages }),
  });
  if (!response.ok) {
    const body = await response.text().catch(() => '');
    throw new Error(`LINE push failed ${response.status}: ${body.slice(0, 260)}`);
  }
}
"""
          if old_push in s:
              s=s.replace(old_push,new_push,1)
          elif "content: string | LineMessage[]" not in s:
              raise SystemExit('linePush marker missing')

          old_sig="""  idempotencyKey: string;
  text: string;
  payload?: Record<string, unknown>;
"""
          new_sig="""  idempotencyKey: string;
  text: string;
  messages?: LineMessage[];
  payload?: Record<string, unknown>;
"""
          if old_sig in s:
              s=s.replace(old_sig,new_sig,1)
          elif "messages?: LineMessage[];" not in s:
              raise SystemExit('sendTeamMessage signature marker missing')

          s=s.replace("await linePush(targetId, input.text);","await linePush(targetId, input.messages?.length ? input.messages : input.text);",1)
          s=s.replace("select=code,name&limit=1","select=code,name,metadata&limit=1",1)
          s=s.replace("const resource = (await resourceResponse.json() as Array<{ code: string; name: string }>)[0];",
                      "const resource = (await resourceResponse.json() as Array<{ code: string; name: string; metadata: Record<string, unknown> }>)[0];",1)

          marker="""  const lines = [
    `${environmentPrefix}🔔 งานใหม่ — ${TEAM_LABELS[teamCode]}`,
    `เลขที่: ${booking.booking_code}`,
    'สถานะ: รอทีมงานยืนยัน',
    customer.name ? `ลูกค้า: ${customer.name}` : '',
    customer.phone ? `โทร: ${customer.phone}` : (customer.email ? `อีเมล: ${customer.email}` : ''),
    `วันเวลา: ${thaiDateTime(booking.start_at)}${booking.end_at ? ` → ${thaiDateTime(booking.end_at)}` : ''}`,
    `จำนวน: ${amount}`,
    resource?.name ? `รายการ/ทรัพยากร: ${resource.name}` : '',
    `ช่องทาง: ${booking.source_channel.toUpperCase()}`,
    booking.customer_note ? `หมายเหตุ: ${cleanText(booking.customer_note, 500)}` : '',
    `หลังบ้าน: ${BACKOFFICE_URL}`,
  ].filter(Boolean);

  return sendTeamMessage({
"""
          replacement="""  const lines = [
    `${environmentPrefix}🔔 งานใหม่ — ${TEAM_LABELS[teamCode]}`,
    `เลขที่: ${booking.booking_code}`,
    'สถานะ: รอทีมงานยืนยัน',
    customer.name ? `ลูกค้า: ${customer.name}` : '',
    customer.phone ? `โทร: ${customer.phone}` : (customer.email ? `อีเมล: ${customer.email}` : ''),
    `วันเวลา: ${thaiDateTime(booking.start_at)}${booking.end_at ? ` → ${thaiDateTime(booking.end_at)}` : ''}`,
    `จำนวน: ${amount}`,
    resource?.name ? `รายการ/ทรัพยากร: ${resource.name}` : '',
    `ช่องทาง: ${booking.source_channel.toUpperCase()}`,
    booking.customer_note ? `หมายเหตุ: ${cleanText(booking.customer_note, 500)}` : '',
    `หลังบ้าน: ${BACKOFFICE_URL}`,
  ].filter(Boolean);
  const activityCode = teamCode === 'activity' ? String(resource?.metadata?.activity_code ?? '') : '';
  const messages: LineMessage[] = [buildStaffBookingFlexMessage({
    bookingCode: booking.booking_code,
    serviceName: resource?.name ?? TEAM_LABELS[teamCode],
    teamLabel: TEAM_LABELS[teamCode],
    status: booking.status,
    environment: booking.environment,
    startAt: booking.start_at,
    endAt: booking.end_at,
    customerName: customer.name || undefined,
    phone: customer.phone || undefined,
    amount,
    sourceChannel: booking.source_channel,
    note: booking.customer_note ? cleanText(booking.customer_note, 500) : undefined,
    activityCode: activityCode || undefined,
    backofficeUrl: teamCode === 'activity'
      ? 'https://tamma-backoffice.netlify.app/activity-bookings.html'
      : BACKOFFICE_URL,
  })];

  return sendTeamMessage({
"""
          if marker in s:
              s=s.replace(marker,replacement,1)
          elif "const messages: LineMessage[] = [buildStaffBookingFlexMessage" not in s:
              raise SystemExit('booking card marker missing')

          old_call="""    text: lines.join('\\n'),
    payload: { booking_code: booking.booking_code, source_channel: booking.source_channel },
"""
          new_call="""    text: lines.join('\\n'),
    messages,
    payload: { booking_code: booking.booking_code, source_channel: booking.source_channel },
"""
          if old_call in s:
              s=s.replace(old_call,new_call,1)
          elif "    messages,\n    payload: { booking_code:" not in s:
              raise SystemExit('booking send call marker missing')
          p.write_text(s)

          p=Path('netlify/functions/_ops-line-ui.ts')
          u=p.read_text()
          u=u.replace(
              "    unitText ? valueRow(noun.field, unitText, true) : null,",
              "    unitText ? valueRow(noun.field, unitText, true) : (input.activityCode ? valueRow(noun.field, 'ระบบจะจัดให้อัตโนมัติเมื่อกดรับงาน') : null),",
              1,
          )
          p.write_text(u)
          PY
      - name: Install dependencies
        run: npm ci
      - name: Type check staff workflow files
        run: npx tsc --noEmit --target ES2022 --module commonjs --moduleResolution node --esModuleInterop --skipLibCheck netlify/functions/_ops-line-ui.ts netlify/functions/line-webhook.ts netlify/functions/_ops-notifications.ts netlify/functions/_ops-booking-actions.ts
      - name: Commit checked changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add netlify/functions/_ops-notifications.ts netlify/functions/_ops-line-ui.ts
          git commit -m 'Use one-tap Flex booking cards for staff [skip netlify]'
          git push origin staff-flex-ux
