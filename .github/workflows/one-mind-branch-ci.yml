name: One Mind Branch CI

on:
  push:
    branches:
      - feature/thongthai-one-mind-architecture
  pull_request:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Checkout exact main for WW12 production deploy
        if: github.head_ref == 'ops/ww12-production-deploy'
        uses: actions/checkout@v4
        with:
          ref: main
          clean: true
      - name: Deploy exact main through one-time OIDC relay
        if: github.head_ref == 'ops/ww12-production-deploy'
        env:
          WW12_RELAY_URL: https://upaokrprawzhgzeqsdke.supabase.co/functions/v1/ww12-deploy-relay
        run: |
          set -euo pipefail
          echo "WW12_DEPLOY_MAIN_SHA=$(git rev-parse HEAD)"
          OIDC_JSON="$(curl -fsSL -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=ww12-netlify-deploy")"
          OIDC_TOKEN="$(node -e 'const j=JSON.parse(process.argv[1]); process.stdout.write(j.value||"")' "$OIDC_JSON")"
          test -n "$OIDC_TOKEN"
          PROXY="$(curl -fsS -X POST -H "Authorization: Bearer $OIDC_TOKEN" "$WW12_RELAY_URL")"
          [[ "$PROXY" == https://netlify-mcp.netlify.app/proxy/* ]]
          echo "::add-mask::$PROXY"
          npx -y @netlify/mcp@latest \
            --site-id 8c1f4d60-68c9-4940-9152-89e9c967e22c \
            --proxy-path "$PROXY"
