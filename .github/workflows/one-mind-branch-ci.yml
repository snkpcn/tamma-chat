name: One Mind Branch CI

on:
  push:
    branches:
      - feature/thongthai-one-mind-architecture
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: WW10 production multilingual smoke
        env:
          THONGTHAI_PRODUCTION_URL: https://tamma-chat.netlify.app/.netlify/functions/thongthai-chat
        run: |
          node --input-type=module <<'NODE'
          import { randomUUID } from 'node:crypto';
          const cases = [
            {
              id:'th-worldwide',
              language:'th',
              message:'ค่าส่งสินค้า OTOP ไปสวีเดนเท่าไหร่ครับ ถ้ายังไม่มีราคาจริงบอกตรงๆนะครับ',
              accept:reply => /[ก-๙]/u.test(reply) && /สวีเดน/u.test(reply) && /(?:ยัง.{0,24}(?:ยืนยัน|เปิด|รองรับ|ตรวจสอบ|ไม่มี)|ไม่สามารถ.{0,24}(?:ยืนยัน|ตรวจสอบ)|ยังไม่มี.{0,24}(?:ข้อมูล|ค่าส่ง|ระบบ))/u.test(reply),
              forbid:[
                /(?:SEK|USD)\s*\d|\d+(?:\.\d+)?\s*(?:SEK|USD)/iu,
                /ต้อง.{0,18}(?:ทราบ|รู้).{0,18}(?:ยอด|ค่าสินค้า).{0,18}ก่อน/u,
              ],
            },
            {
              id:'sv-worldwide',
              language:'en',
              message:'Kan ni skicka OTOP-produkter till Sverige? Om den internationella frakten inte är verifierad ännu, säg det tydligt på svenska.',
              accept:reply => /(?:Sverige|frakt|skicka|leverans|verifier|bekräft)/iu.test(reply),
              forbid:[/ครับ|ค่ะ|คะ/u,/(?:SEK|USD|THB)\s*\d|\d+(?:\.\d+)?\s*(?:SEK|USD|THB)/iu],
            },
          ];
          const requestBase = {
            chatHistory:[],
            guestContext:{
              tripDuration:null,travelerType:null,
              group:{adults:null,children:null,elderly:null},
              interests:[],pace:null,budget:null,constraints:[],
            },
            journeyContext:{
              currentPlan:null,savedPlan:null,
              visitedExperiences:[],favorites:[],journalEntries:[],
            },
            pageContext:{section:'web'},
            environment:'live',
          };
          for (const tc of cases) {
            const guestId=randomUUID();
            const eventId='ww10-prod-smoke-'+tc.id+'-'+Date.now();
            const response=await fetch(process.env.THONGTHAI_PRODUCTION_URL,{
              method:'POST',
              headers:{'content-type':'application/json'},
              body:JSON.stringify({...requestBase,guestId,eventId,message:tc.message,language:tc.language}),
            });
            const body=await response.json().catch(()=>({}));
            const reply=String(body.message??'');
            console.log(JSON.stringify({id:tc.id,status:response.status,guestId,eventId,reply}));
            if(response.status!==200)throw new Error(tc.id+': HTTP '+response.status);
            if(reply.trim().length<20)throw new Error(tc.id+': empty/short reply');
            if(!tc.accept(reply))throw new Error(tc.id+': language/fail-closed acceptance failed');
            for(const pattern of tc.forbid){
              if(pattern.test(reply))throw new Error(tc.id+': forbidden fabricated/voice pattern '+pattern);
            }
          }
          NODE
