name: Phase N retire web fallback

on:
  push:
    branches:
      - feature/thongthai-one-mind-architecture
    paths:
      - scripts/phase-n-retire-web-concierge.mjs
      - .github/workflows/phase-n-index-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event.head_commit.message != 'N auto-retire web local concierge fallback'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/thongthai-one-mind-architecture
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/phase-n-retire-web-concierge.mjs
      - name: Commit cleanup
        run: |
          if git diff --quiet -- index.html; then
            echo "No index cleanup needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "N auto-retire web local concierge fallback"
          git push origin HEAD:feature/thongthai-one-mind-architecture
