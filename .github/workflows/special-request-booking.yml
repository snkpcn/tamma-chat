name: Special request booking
on:
  push:
    branches: [special-request-booking]
    paths:
      - .github/workflows/special-request-booking.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: special-request-booking
          fetch-depth: 0
      - name: Patch Thongthai booking policy
        run: python3 scripts/patch_special_request_booking.py
      - name: Validate policy markers
        run: |
          grep -q 'Stay special request is part of the booking itself' netlify/functions/_thongthai-brain-v3.ts
          grep -q 'create_booking.note' netlify/functions/_thongthai-brain-v3.ts
          grep -q 'v3-special-request' netlify/functions/_thongthai-brain-v3.ts
      - name: Validate TypeScript
        run: npx -y esbuild@latest netlify/functions/_thongthai-brain-v3.ts --bundle --platform=node --format=esm --outfile=/tmp/brain.mjs
      - name: Commit patch and cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/special-request-booking.yml scripts/patch_special_request_booking.py
          git add netlify/functions/_thongthai-brain-v3.ts
          git commit -m "Route stay special requests through booking"
          git push origin special-request-booking
