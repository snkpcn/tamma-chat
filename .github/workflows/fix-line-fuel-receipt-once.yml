name: Fix LINE fuel receipt guard once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-line-fuel-receipt-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch fuel receipt validation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('netlify/functions/_ops-fuel-receipts.ts')
          s = p.read_text()

          old = """  const x = input.extraction;\n  if (!extractionHasLedgerValue(x)) throw new Error('receipt_has_no_ledger_value');"""
          new = """  const x = input.extraction;\n  if (!x.is_fuel_receipt) throw new Error('not_fuel_receipt');\n  if (!extractionHasLedgerValue(x)) throw new Error('receipt_has_no_ledger_value');"""
          assert old in s, 'insertFuelLog anchor missing'
          s = s.replace(old, new, 1)

          old = """    const extraction = pendingExtraction(session);\n    if (extraction && session?.pending_line_message_id && session.pending_received_at) {\n      if (!extractionHasLedgerValue(extraction)) {"""
          new = """    const extraction = pendingExtraction(session);\n    if (extraction && session?.pending_line_message_id && session.pending_received_at) {\n      if (!extraction.is_fuel_receipt) {\n        await clearSession(input.targetId, input.userId);\n        return `รูปที่ส่งมาไม่ใช่สลิปเติมน้ำมันครับ${extraction.merchant ? ` — อ่านได้ว่าเป็น ${extraction.merchant}` : ''}\\nไม่ได้บันทึกลงตารางน้ำมัน`;\n      }\n      if (!extractionHasLedgerValue(extraction)) {"""
          assert old in s, 'pending extraction anchor missing'
          s = s.replace(old, new, 1)

          old = """  const extractionForSession = { ...extraction, receipt_sha256: image.sha256 } as unknown as Record<string, unknown>;\n  if (!extractionHasLedgerValue(extraction)) {"""
          new = """  const extractionForSession = { ...extraction, receipt_sha256: image.sha256 } as unknown as Record<string, unknown>;\n  if (!extraction.is_fuel_receipt) {\n    await clearSession(input.targetId, input.userId);\n    return `รูปที่ส่งมาไม่ใช่สลิปเติมน้ำมันครับ${extraction.merchant ? ` — อ่านได้ว่าเป็น ${extraction.merchant}` : ''}\\nไม่ได้บันทึกลงตารางน้ำมัน`;\n  }\n  if (!extractionHasLedgerValue(extraction)) {"""
          assert old in s, 'image extraction anchor missing'
          s = s.replace(old, new, 1)

          p.write_text(s)
          PY
      - name: Commit fix and remove one-time workflow
        shell: bash
        run: |
          rm .github/workflows/fix-line-fuel-receipt-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add netlify/functions/_ops-fuel-receipts.ts .github/workflows/fix-line-fuel-receipt-once.yml
          git commit -m "Reject non-fuel receipts from LINE fuel ledger"
          git push origin HEAD:main
