name: Phase 2 Wave A Live

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  wave-a:
    if: contains(github.event.pull_request.title, '[run wave-a]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Run Activity + Stay real production safety gauntlet
        run: npx tsx scripts/run-phase2-live-safety-gauntlet.ts
