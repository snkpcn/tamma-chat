name: Patch activity inventory booking once
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-activity-inventory-booking-once.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch activity booking flow
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def between(text: str, start: str, end: str, replacement: str) -> str:
              i = text.index(start)
              j = text.index(end, i)
              return text[:i] + replacement + text[j:]

          # ---- operations DB: inventory-backed activity windows ----
          p = Path('netlify/functions/_operations-db.ts')
          text = p.read_text()
          old_iface = """export interface BookingOption {
            scheduleId: string;
            resourceCode: string;
            resourceName: string;
            serviceType: ServiceType;
            startAt: string;
            endAt: string;
            available: number;
          }
          """
          new_iface = """export interface BookingOption {
            scheduleId: string;
            scheduleIds?: string[];
            resourceCode: string;
            resourceName: string;
            serviceType: ServiceType;
            startAt: string;
            endAt: string;
            available: number;
            durationMinutes?: number;
          }
          """
          assert old_iface in text, 'BookingOption interface changed upstream'
          text = text.replace(old_iface, new_iface, 1)

          new_list = r'''function normalizeActivityDuration(value: number | null | undefined): 30 | 60 | 90 {
            const n = Number(value);
            return n === 60 ? 60 : n === 90 ? 90 : 30;
          }

          export async function listBookingOptions(
            serviceType: ServiceType,
            date: string,
            environment: 'live' | 'test' = 'live',
            resourceCode?: string | null,
            durationMinutes?: number | null,
            partySize?: number | null,
          ): Promise<BookingOption[]> {
            const bounds = dayBounds(date);
            if (!bounds) return [];
            const resourcesRes = await dbFetch(
              `service_resources?service_type=eq.${serviceType}&active=eq.true`
              + (resourceCode ? `&code=eq.${encodeURIComponent(resourceCode)}` : '')
              + '&select=id,code,name,metadata',
            );
            const resources = await resourcesRes.json() as Array<{ id: string; code: string; name: string; metadata: Record<string, unknown> }>;
            const output: BookingOption[] = [];
            const requestedUnits = Math.max(1, Math.min(50, Math.floor(partySize ?? 1)));
            const activityDuration = normalizeActivityDuration(durationMinutes);
            const windowSize = activityDuration / 30;

            for (const resource of resources) {
              const res = await dbFetch(
                `service_schedules?resource_id=eq.${resource.id}&environment=eq.${environment}&status=eq.open`
                + `&start_at=gte.${encodeURIComponent(bounds.start)}&start_at=lte.${encodeURIComponent(bounds.end)}`
                + '&select=id,start_at,end_at,capacity_total,capacity_reserved&order=start_at.asc',
              );
              const rows = await res.json() as Array<{ id: string; start_at: string; end_at: string; capacity_total: number; capacity_reserved: number }>;

              if (serviceType !== 'activity') {
                for (const row of rows) {
                  output.push({
                    scheduleId: row.id,
                    resourceCode: resource.code,
                    resourceName: resource.name,
                    serviceType,
                    startAt: row.start_at,
                    endAt: row.end_at,
                    available: Math.max(0, Number(row.capacity_total) - Number(row.capacity_reserved)),
                  });
                }
                continue;
              }

              for (let i = 0; i + windowSize <= rows.length; i += 1) {
                const window = rows.slice(i, i + windowSize);
                let contiguous = true;
                for (let j = 1; j < window.length; j += 1) {
                  if (new Date(window[j].start_at).getTime() !== new Date(window[j - 1].end_at).getTime()) {
                    contiguous = false;
                    break;
                  }
                }
                if (!contiguous) continue;
                const available = Math.min(...window.map(row => Math.max(0, Number(row.capacity_total) - Number(row.capacity_reserved))));
                if (available < requestedUnits) continue;
                output.push({
                  scheduleId: window[0].id,
                  scheduleIds: window.map(row => row.id),
                  resourceCode: resource.code,
                  resourceName: resource.name,
                  serviceType,
                  startAt: window[0].start_at,
                  endAt: window[window.length - 1].end_at,
                  available,
                  durationMinutes: activityDuration,
                });
              }
            }
            return output;
          }

          '''
          text = between(text, 'export async function listBookingOptions(', 'async function scheduleRowsForBooking(', new_list)

          new_schedule = r'''async function scheduleRowsForBooking(args: {
            serviceType: ServiceType;
            resourceCode?: string;
            date: string;
            time?: string | null;
            endDate?: string | null;
            durationMinutes?: number | null;
            partySize?: number | null;
            environment: 'live' | 'test';
          }): Promise<BookingOption[]> {
            const resourcesRes = await dbFetch(
              `service_resources?service_type=eq.${args.serviceType}&active=eq.true`
              + (args.resourceCode ? `&code=eq.${encodeURIComponent(args.resourceCode)}` : '')
              + '&select=id,code,name&limit=8',
            );
            const resources = await resourcesRes.json() as Array<{ id: string; code: string; name: string }>;
            if (!resources.length) return [];

            if (args.serviceType !== 'stay') {
              let options = await listBookingOptions(
                args.serviceType,
                args.date,
                args.environment,
                args.resourceCode ?? null,
                args.serviceType === 'activity' ? args.durationMinutes ?? null : null,
                args.partySize ?? null,
              );
              if (args.resourceCode) options = options.filter(item => item.resourceCode === args.resourceCode);
              if (args.time && /^\d{2}:\d{2}$/.test(args.time)) {
                options = options.filter(item => {
                  const local = new Intl.DateTimeFormat('en-GB', { timeZone: 'Asia/Bangkok', hour: '2-digit', minute: '2-digit', hour12: false }).format(new Date(item.startAt));
                  return local === args.time;
                });
              }
              return options;
            }

            if (!/^\d{4}-\d{2}-\d{2}$/.test(args.date) || !args.endDate || !/^\d{4}-\d{2}-\d{2}$/.test(args.endDate)) return [];
            const checkIn = new Date(`${args.date}T00:00:00+07:00`);
            const checkOut = new Date(`${args.endDate}T00:00:00+07:00`);
            if (!(checkOut > checkIn)) return [];
            const nights = Math.round((checkOut.getTime() - checkIn.getTime()) / 86400000);
            if (nights < 1 || nights > 30) return [];
            const resource = resources[0];
            const endBound = `${args.endDate}T23:59:59+07:00`;
            const res = await dbFetch(
              `service_schedules?resource_id=eq.${resource.id}&environment=eq.${args.environment}&status=eq.open`
              + `&start_at=gte.${encodeURIComponent(`${args.date}T00:00:00+07:00`)}`
              + `&start_at=lt.${encodeURIComponent(endBound)}`
              + '&select=id,start_at,end_at,capacity_total,capacity_reserved&order=start_at.asc',
            );
            const rows = await res.json() as Array<{ id: string; start_at: string; end_at: string; capacity_total: number; capacity_reserved: number }>;
            const picked = rows.slice(0, nights).map(row => ({
              scheduleId: row.id,
              resourceCode: resource.code,
              resourceName: resource.name,
              serviceType: args.serviceType,
              startAt: row.start_at,
              endAt: row.end_at,
              available: Math.max(0, Number(row.capacity_total) - Number(row.capacity_reserved)),
            }));
            return picked.length === nights ? picked : [];
          }

          '''
          text = between(text, 'async function scheduleRowsForBooking(', 'function shiftIsoDate(', new_schedule)

          new_create = r'''export interface CreateBookingInput {
            guestDbId?: string | null;
            channel: OpsChannel;
            serviceType: ServiceType;
            resourceCode?: string | null;
            date: string;
            time?: string | null;
            endDate?: string | null;
            durationMinutes?: number | null;
            partySize?: number | null;
            quantity?: number | null;
            customerName?: string | null;
            phone?: string | null;
            email?: string | null;
            note?: string | null;
            environment?: 'live' | 'test';
          }

          export async function createBooking(input: CreateBookingInput): Promise<{ bookingCode: string; status: string; startAt: string; endAt: string }> {
            const environment = input.environment ?? 'live';
            if (input.serviceType === 'activity') {
              if (!input.resourceCode) throw new Error('activity_resource_required');
              if (![30, 60, 90].includes(Number(input.durationMinutes))) throw new Error('activity_duration_required');
            }
            const options = await scheduleRowsForBooking({
              serviceType: input.serviceType,
              resourceCode: input.resourceCode ?? undefined,
              date: input.date,
              time: input.time,
              endDate: input.endDate,
              durationMinutes: input.durationMinutes,
              partySize: input.partySize,
              environment,
            });
            if (!options.length) throw new Error('no_matching_schedule');
            if (input.serviceType !== 'stay' && options.length !== 1) throw new Error('schedule_choice_required');

            const units = input.serviceType === 'stay'
              ? Math.max(1, Math.min(6, Math.floor(input.quantity ?? 1)))
              : Math.max(1, Math.min(50, Math.floor(input.partySize ?? 1)));
            if (options.some(option => option.available < units)) throw new Error('schedule_full');

            const customerId = await upsertCustomerAccount({
              guestDbId: input.guestDbId,
              fullName: input.customerName,
              email: input.email,
              phone: input.phone,
              preferredContact: input.phone ? 'phone' : input.email ? 'email' : null,
              isTest: environment === 'test',
            });
            const resourceRes = await dbFetch(`service_resources?code=eq.${encodeURIComponent(options[0].resourceCode)}&select=id&limit=1`);
            const resourceRows = await resourceRes.json() as Array<{ id: string }>;
            if (!resourceRows[0]?.id) throw new Error('resource_not_found');
            const startAt = options[0].startAt;
            const endAt = input.serviceType === 'activity' ? options[0].endAt : options[options.length - 1].endAt;

            const bookingRes = await dbFetch('bookings', {
              method: 'POST',
              headers: { Prefer: 'return=representation' },
              body: JSON.stringify({
                customer_id: customerId,
                guest_id: input.guestDbId ?? null,
                service_type: input.serviceType,
                resource_id: resourceRows[0].id,
                start_at: startAt,
                end_at: endAt,
                party_size: input.partySize ?? null,
                quantity: input.quantity ?? 1,
                status: 'requested',
                source_channel: input.channel,
                customer_note: input.note?.slice(0, 1000) ?? null,
                environment,
              }),
            });
            const bookings = await bookingRes.json() as Array<{ id: string; booking_code: string; status: string }>;
            const booking = bookings[0];
            if (!booking) throw new Error('booking_not_created');
            try {
              const allocationScheduleIds = input.serviceType === 'activity'
                ? (options[0].scheduleIds?.length ? options[0].scheduleIds : [options[0].scheduleId])
                : options.map(option => option.scheduleId);
              await dbFetch('booking_allocations', {
                method: 'POST',
                headers: { Prefer: 'return=minimal' },
                body: JSON.stringify(allocationScheduleIds.map(scheduleId => ({
                  booking_id: booking.id,
                  schedule_id: scheduleId,
                  capacity_units: units,
                }))),
              });
            } catch (error) {
              await dbFetch(`bookings?id=eq.${booking.id}`, { method: 'DELETE' }).catch(() => undefined);
              throw error;
            }
            return { bookingCode: booking.booking_code, status: booking.status, startAt, endAt };
          }

          '''
          text = between(text, 'export interface CreateBookingInput {', 'export async function createCafeInquiry(', new_create)
          p.write_text(text)

          # ---- brain: collect activity + duration and expose tool args ----
          p = Path('netlify/functions/_thongthai-brain-v3.ts')
          text = p.read_text()
          text = text.replace(
              "export const THONGTHAI_BRAIN_VERSION = '2026-09-agentic-operations-v3-special-request';",
              "export const THONGTHAI_BRAIN_VERSION = '2026-09-agentic-operations-v3-activity-inventory';",
              1,
          )
          old_activity = "- Activity booking: requires date, specific available time/slot, participant count, and customer name/contact."
          new_activity = """- Activity booking is inventory-backed. The verified world facts contain the current real catalog, prices and active inventory. Never invent them.
          - Valid activity resource mapping: ATV = activity-atv, ขี่ม้า = activity-horse, ยิงธนู = activity-archery. Do not use the old generic activity-adventure resource.
          - Before creating an activity booking, collect: exact activity, duration (30/60/90 minutes), date, a specific available start time, participant count, and customer name/contact. Participant count consumes the same number of physical capacity units.
          - For activity pricing, a null price means the owner has not configured that price yet. Say the price is not set/needs staff confirmation; never turn null into 0 or invent a price."""
          assert old_activity in text, 'activity prompt line changed upstream'
          text = text.replace(old_activity, new_activity, 1)
          text = text.replace(
              "1. list_booking_options {serviceType, date} — check live schedule for restaurant | stay | activity. For stay this lists check-in day availability only; use create_booking with check-in/check-out for final allocation.\n2. create_booking {serviceType, resourceCode?, date, time?, endDate?, partySize?, quantity?, customerName?, phone?, email?, note?} — create a REAL requested booking. For stay, note is the guest's special request / preparation note and must travel with the booking when provided. Use only after explicit booking intent and enough details. Do not call if multiple slots are still ambiguous.",
              "1. list_booking_options {serviceType, date, resourceCode?, durationMinutes?, partySize?} — check live schedule for restaurant | stay | activity. For activity, pass the exact resourceCode plus 30/60/90 duration and participant count so availability spans the whole requested duration. For stay this lists check-in day availability only; use create_booking with check-in/check-out for final allocation.\n2. create_booking {serviceType, resourceCode?, date, time?, endDate?, durationMinutes?, partySize?, quantity?, customerName?, phone?, email?, note?} — create a REAL requested booking. For activity, resourceCode and durationMinutes are mandatory and the selected slot must be unambiguous. For stay, note is the guest's special request / preparation note and must travel with the booking when provided. Use only after explicit booking intent and enough details. Do not call if multiple slots are still ambiguous.",
              1,
          )

          list_start = "    if (name === 'list_booking_options') {"
          list_end = "    if (name === 'create_booking') {"
          new_norm_list = r'''    if (name === 'list_booking_options') {
              const serviceType = safeString(args.serviceType,20);
              const date = dateString(args.date);
              if (serviceType && ['restaurant','stay','activity'].includes(serviceType) && date) calls.push({ name, args: {
                serviceType, date,
                ...(safeString(args.resourceCode,80) ? { resourceCode: safeString(args.resourceCode,80) } : {}),
                ...(safeNumber(args.durationMinutes,30,90) && [30,60,90].includes(Number(args.durationMinutes)) ? { durationMinutes: safeNumber(args.durationMinutes,30,90) } : {}),
                ...(safeNumber(args.partySize,1,50) ? { partySize: safeNumber(args.partySize,1,50) } : {}),
              }});
              continue;
            }
          '''
          text = between(text, list_start, list_end, new_norm_list)
          create_start = "    if (name === 'create_booking') {"
          create_end = "    if (name === 'create_cafe_inquiry') {"
          new_norm_create = r'''    if (name === 'create_booking') {
              const serviceType = safeString(args.serviceType,20); const date = dateString(args.date);
              if (!serviceType || !['restaurant','stay','activity'].includes(serviceType) || !date) continue;
              calls.push({ name, args: {
                serviceType, date,
                ...(safeString(args.resourceCode,80) ? { resourceCode: safeString(args.resourceCode,80) } : {}),
                ...(timeString(args.time) ? { time: timeString(args.time) } : {}),
                ...(dateString(args.endDate) ? { endDate: dateString(args.endDate) } : {}),
                ...(safeNumber(args.durationMinutes,30,90) && [30,60,90].includes(Number(args.durationMinutes)) ? { durationMinutes: safeNumber(args.durationMinutes,30,90) } : {}),
                ...(safeNumber(args.partySize,1,50) ? { partySize: safeNumber(args.partySize,1,50) } : {}),
                ...(safeNumber(args.quantity,1,20) ? { quantity: safeNumber(args.quantity,1,20) } : {}),
                ...(safeString(args.customerName,120) ? { customerName: safeString(args.customerName,120) } : {}),
                ...(safeString(args.phone,30) ? { phone: safeString(args.phone,30) } : {}),
                ...(safeString(args.email,160) ? { email: safeString(args.email,160) } : {}),
                ...(safeString(args.note,1000) ? { note: safeString(args.note,1000) } : {}),
              }}); continue;
            }
          '''
          text = between(text, create_start, create_end, new_norm_create)
          p.write_text(text)

          # ---- runtime: dynamic real catalog + new tool parameters ----
          p = Path('netlify/functions/_thongthai-runtime-v3.ts')
          text = p.read_text()
          helper = r'''async function loadActivityWorldFacts(): Promise<WorldFactRow[]> {
            try {
              const [offerRes, assetRes] = await Promise.all([
                dbFetch('activity_offerings?active=eq.true&select=activity_code,activity_name,duration_minutes,price,currency,metadata&order=sort_order.asc'),
                dbFetch('activity_assets?active=eq.true&select=activity_code,asset_code,name,asset_type,metadata&order=sort_order.asc'),
              ]);
              const offerings = await offerRes.json() as Array<{ activity_code:string; activity_name:string; duration_minutes:number; price:number|null; currency:string; metadata:Record<string,unknown> }>;
              const assets = await assetRes.json() as Array<{ activity_code:string; asset_code:string; name:string; asset_type:string; metadata:Record<string,unknown> }>;
              const resourceCode = (code:string) => code === 'atv' ? 'activity-atv' : code === 'horse' ? 'activity-horse' : 'activity-archery';
              const codes = [...new Set(offerings.map(row => row.activity_code))];
              const activities = codes.map(code => {
                const rows = offerings.filter(row => row.activity_code === code);
                const physical = assets.filter(row => row.activity_code === code);
                return {
                  activityCode: code,
                  resourceCode: resourceCode(code),
                  name: rows[0]?.activity_name ?? code,
                  durations: rows.map(row => ({ durationMinutes:Number(row.duration_minutes), price:row.price == null ? null : Number(row.price), currency:row.currency })),
                  activeInventory: physical.length,
                  assets: physical.map(row => ({ code:row.asset_code, name:row.name, type:row.asset_type })),
                };
              });
              const now = new Date().toISOString();
              return [{
                fact_key:'activity_catalog_live', category:'operations',
                fact_value:{ timezone:'Asia/Bangkok', serviceHours:{ start:'09:00', end:'17:00' }, bookingSlotMinutes:30, activities },
                source:'activity_offerings+activity_assets', updated_at:now,
              }];
            } catch (error) {
              console.error('THONGTHAI_ACTIVITY_FACTS_ERROR', error instanceof Error ? error.message.slice(0,180) : 'unknown');
              return [];
            }
          }

          '''
          marker = 'function provider(channel: BrainChannel): OpsChannel {'
          assert marker in text, 'runtime provider marker missing'
          text = text.replace(marker, helper + marker, 1)
          old_world = "    const worldPromise = dbFetch('world_facts?active=eq.true&verified=eq.true&select=fact_key,category,fact_value,source,updated_at&order=fact_key.asc').then(r => r.json() as Promise<WorldFactRow[]>);"
          new_world = """    const worldPromise = Promise.all([
              dbFetch('world_facts?active=eq.true&verified=eq.true&select=fact_key,category,fact_value,source,updated_at&order=fact_key.asc').then(r => r.json() as Promise<WorldFactRow[]>),
              loadActivityWorldFacts(),
            ]).then(([baseFacts, activityFacts]) => [...baseFacts, ...activityFacts]);"""
          assert old_world in text, 'worldPromise changed upstream'
          text = text.replace(old_world, new_world, 1)
          text = text.replace(
              "  if (message.includes('product_not_available')) return 'product_not_available';",
              "  if (message.includes('activity_resource_required')) return 'activity_resource_required';\n  if (message.includes('activity_duration_required')) return 'activity_duration_required';\n  if (message.includes('product_not_available')) return 'product_not_available';",
              1,
          )
          list_start = "      if (call.name === 'list_booking_options') {"
          list_end = "      if (call.name === 'create_booking') {"
          new_exec_list = r'''      if (call.name === 'list_booking_options') {
                const serviceType = String(call.args.serviceType) as ServiceType;
                const date = String(call.args.date ?? '');
                const resourceCode = typeof call.args.resourceCode === 'string' ? call.args.resourceCode : null;
                const durationMinutes = typeof call.args.durationMinutes === 'number' ? call.args.durationMinutes : null;
                const partySize = typeof call.args.partySize === 'number' ? call.args.partySize : null;
                const options = await listBookingOptions(serviceType,date,'live',resourceCode,durationMinutes,partySize);
                results.push({ name:call.name, ok:true, detail:JSON.stringify({ date, serviceType, resourceCode, durationMinutes, partySize, options:options.slice(0,24) }) });
                continue;
              }
          '''
          text = between(text, list_start, list_end, new_exec_list)
          create_start = "      if (call.name === 'create_booking') {"
          create_end = "      if (call.name === 'create_cafe_inquiry') {"
          old_create_block = text[text.index(create_start):text.index(create_end, text.index(create_start))]
          new_create_block = old_create_block.replace(
              "            endDate:typeof call.args.endDate === 'string' ? call.args.endDate : null,\n            partySize:typeof call.args.partySize === 'number' ? call.args.partySize : null,",
              "            endDate:typeof call.args.endDate === 'string' ? call.args.endDate : null,\n            durationMinutes:typeof call.args.durationMinutes === 'number' ? call.args.durationMinutes : null,\n            partySize:typeof call.args.partySize === 'number' ? call.args.partySize : null,",
              1,
          )
          old_fallback = "            const options = await listBookingOptions(serviceType,date,'live').catch(() => []);"
          new_fallback = """            const options = await listBookingOptions(
              serviceType,
              date,
              'live',
              typeof call.args.resourceCode === 'string' ? call.args.resourceCode : null,
              typeof call.args.durationMinutes === 'number' ? call.args.durationMinutes : null,
              typeof call.args.partySize === 'number' ? call.args.partySize : null,
            ).catch(() => []);"""
          assert old_fallback in new_create_block, 'runtime fallback changed upstream'
          new_create_block = new_create_block.replace(old_fallback, new_fallback, 1)
          text = text[:text.index(create_start)] + new_create_block + text[text.index(create_end, text.index(create_start)):]
          p.write_text(text)

          # ---- migration files for source control ----
          mig = Path('netlify/functions/supabase/activity-inventory-slots-v1.sql')
          mig.parent.mkdir(parents=True, exist_ok=True)
          mig.write_text('''-- Applied in production: real activity resources and inventory-backed 30-minute base slots.\n-- Canonical migration is recorded in Supabase as activity_inventory_slots_v1.\n-- Resources: activity-atv, activity-horse, activity-archery.\n-- Physical inventory in activity_assets drives capacities through trg_activity_assets_sync_capacity.\n-- Offerings remain 30/60/90 minutes with price nullable for owner entry.\n-- Base schedules run 09:00-17:00 Asia/Bangkok and multi-slot bookings reserve every 30-minute segment.\n''')
          roll = Path('netlify/functions/supabase/activity-schedule-rollover-v1.sql')
          roll.write_text('''-- Applied in production as activity_schedule_rollover_v1.\n-- public.roll_activity_schedules() keeps a rolling 180-day live / 60-day test activity calendar.\n-- cron job tamma-activity-schedule-rollover runs daily at 17:20 UTC (00:20 Asia/Bangkok).\n''')

          # Remove this one-shot workflow from the final tree.
          Path('.github/workflows/patch-activity-inventory-booking-once.yml').unlink()
          PY
      - name: Sanity check patched source
        run: |
          grep -q "activity_resource_required" netlify/functions/_operations-db.ts
          grep -q "activity_catalog_live" netlify/functions/_thongthai-runtime-v3.ts
          grep -q "activity-inventory" netlify/functions/_thongthai-brain-v3.ts
          grep -q "durationMinutes" netlify/functions/_operations-db.ts
      - name: Commit final patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Wire activity booking to physical inventory"
          git push origin HEAD:main
