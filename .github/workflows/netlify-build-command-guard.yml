name: Netlify Build Command Guard

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  exact-netlify-build-command:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Run exact Netlify build command
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const { spawnSync } = require('node:child_process');
          const source = fs.readFileSync('netlify.toml', 'utf8');
          const match = source.match(/^\s*command\s*=\s*"([^"]+)"\s*$/m);
          if (!match) {
            console.error('NETLIFY_BUILD_COMMAND_NOT_FOUND');
            process.exit(1);
          }
          console.log('NETLIFY_BUILD_COMMAND:', match[1]);
          const result = spawnSync(match[1], { shell: true, stdio: 'inherit' });
          process.exit(result.status ?? 1);
          NODE
