name: Activity Polish Production Once
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/activity-polish-production-once.yml
permissions:
  contents: write
jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/activity_polish.py
      - run: npm ci
      - run: npx tsc --noEmit --target ES2022 --module commonjs --moduleResolution node --esModuleInterop --skipLibCheck netlify/functions/_ops-line-ui.ts netlify/functions/line-webhook.ts netlify/functions/_ops-booking-actions.ts
      - run: |
          rm .github/workflows/activity-polish-production-once.yml
          rm .github/scripts/activity_polish.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add netlify/functions/_ops-line-ui.ts .github/workflows/activity-polish-production-once.yml .github/scripts/activity_polish.py
          git commit -m 'Polish Activity staff controls'
          git push origin main
