      - run: npm ci
      - name: Typecheck Activity LINE workflow
        run: npx tsc --noEmit --target ES2022 --module commonjs --moduleResolution node --esModuleInterop --skipLibCheck netlify/functions/_ops-line-ui.ts netlify/functions/line-webhook.ts netlify/functions/_ops-booking-actions.ts
      - name: Commit final Activity polish
        run: |
          rm .github/workflows/activity-staff-polish-once.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add netlify/functions/_ops-line-ui.ts .github/workflows/activity-staff-polish-once.yml
          git commit -m 'Polish Activity staff controls [skip netlify]'
          git push origin activity-staff-polish
