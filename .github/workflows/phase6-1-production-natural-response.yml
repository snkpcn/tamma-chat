name: Phase 6.1 Production E2E Natural Response

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase6-1-production:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.title, '[run phase6 prod]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Run read-only production E2E natural-response matrix
        env:
          THONGTHAI_PRODUCTION_URL: https://tamma-chat.netlify.app/.netlify/functions/thongthai-chat
        run: npx tsx scripts/run-phase6-1-production-natural-response.ts
