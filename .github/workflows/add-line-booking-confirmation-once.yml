name: Add LINE booking confirmation once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/add-line-booking-confirmation-once.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch staff confirmation flow
        run: |
          echo '' | base64 -d > /tmp/patch.py
          python /tmp/patch.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add netlify/functions/_ops-notifications.ts
          git commit -m 'Confirm bookings from staff LINE groups' || exit 0
          git push origin main
