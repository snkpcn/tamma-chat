name: Wire booking lifecycle once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/add-line-booking-confirmation-once.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Wire booking action handler
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('netlify/functions/_ops-notifications.ts')
          s = p.read_text()
          imp = "import { handleBookingOpsCommand } from './_ops-booking-actions';\n"
          if imp not in s:
              s = imp + s
          marker = "  const text = input.text.trim();\n"
          hook = """  const text = input.text.trim();
  const bookingAction = await handleBookingOpsCommand({
    targetId: input.targetId,
    userId: input.userId,
    text,
  });
  if (bookingAction.handled) return bookingAction.reply;
"""
          if hook not in s:
              if marker not in s:
                  raise SystemExit('handler marker not found')
              s = s.replace(marker, hook, 1)
          p.write_text(s)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add netlify/functions/_ops-notifications.ts
          git rm .github/workflows/add-line-booking-confirmation-once.yml
          git commit -m 'Finish LINE booking lifecycle actions'
          git push origin main
