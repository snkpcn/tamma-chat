name: Agent Prepare Phase 1 Final Certification

on:
  push:
    branches:
      - agent-prepare-phase1-final-cert-395

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Run final Phase 1 prepare-only certification
        run: npx tsx scripts/run-agent-prepare-phase1-final-cert.ts
