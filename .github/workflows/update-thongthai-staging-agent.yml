name: Update Thongthai Staging Agent

on:
  push:
    branches:
      - feature/thongthai-agent-shadow-20261001
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  update-agent:
    if: github.head_ref == 'feature/thongthai-agent-shadow-20261001' || github.ref_name == 'feature/thongthai-agent-shadow-20261001'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Update Thongthai-Staging saved agent
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          THONGTHAI_AGENT_MODEL: gpt-5.6-terra
        run: npm run agent:thongthai:staging
