<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>เมนู ตำมา-ชาติ</title>
<meta name="description" content="เมนูจริงและสถานะวัตถุดิบล่าสุดของร้าน ตำมา-ชาติ">
<style>
:root{--paper:#f7f0df;--ink:#3b2014;--muted:#816f61;--green:#4f6538;--line:#d8c7aa;--card:#fffaf0;--danger:#9b352b}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font-body)}.wrap{max-width:1100px;margin:auto;padding:20px 16px 60px}.hero{text-align:center;padding:22px 8px 20px;border-bottom:1px solid var(--line);position:relative}.brand{font-family:var(--font-body);font-size:clamp(42px,8vw,76px);font-weight:800;line-height:1}.sub{margin-top:8px;color:var(--muted)}.truth{display:inline-flex;align-items:center;gap:7px;margin-top:13px;padding:8px 12px;border:1px solid #b9c3a3;border-radius:999px;background:#f3f6eb;color:#465735;font-size:13px}.menu-lang{position:absolute;right:0;top:0;width:auto;min-width:80px;border:1px solid var(--line);border-radius:999px;background:var(--card);color:var(--ink);padding:9px 28px 9px 12px;font:inherit;font-size:12px}.bar{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:16px 0}.status{font-size:14px;color:var(--muted)}.chat{display:inline-block;text-decoration:none;background:var(--green);color:white;padding:11px 16px;border-radius:12px;font-weight:700}.categories{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}@media(max-width:720px){.categories{grid-template-columns:1fr}.hero{padding-top:56px}.menu-lang{right:8px;top:6px}}.category{background:rgba(255,250,240,.68);border:1px solid var(--line);border-radius:18px;padding:18px}.category h2{font-family:var(--font-body);margin:0 0 8px;font-size:25px;border-bottom:1px solid var(--line);padding-bottom:9px}.item{padding:12px 0;border-bottom:1px dashed #ddceb7}.item:last-child{border-bottom:0}.top{display:flex;gap:12px;align-items:flex-start}.name{font-weight:750;flex:1;min-width:0}.star{color:#806328}.price{font-family:var(--font-body);font-weight:700;white-space:nowrap}.meta{font-size:12px;color:var(--muted);margin-top:5px;line-height:1.45}.sold .name,.sold .price{color:#958a7f;text-decoration:line-through}.badge{display:inline-block;margin-top:7px;padding:4px 8px;border-radius:8px;font-size:12px;font-weight:700}.ok{background:#edf3e5;color:#52663c}.no{background:#f8e7e2;color:var(--danger)}.empty{text-align:center;padding:50px;color:var(--muted)}.foot{text-align:center;color:var(--muted);font-size:12px;margin-top:24px;line-height:1.6}.retry{border:1px solid var(--line);background:white;border-radius:10px;padding:10px 14px;color:var(--ink);font-weight:700}
</style>
<link rel="stylesheet" href="assets/styles/site-typography.css">
<link rel="stylesheet" href="assets/styles/site-visual-system.css">
<script src="assets/scripts/global-locale.js"></script>
<script src="assets/scripts/first-wave-language-packs.js"></script>
</head>
<body class="site-page site-page--menu">
<main class="wrap">
<header class="hero">
<div class="menu-topbar"><a class="menu-home" href="/" aria-label="ทำมา-ชาติ"><img src="assets/brand/logos/tamma-chat-logo.svg" width="1051" height="404" alt="ทำมา-ชาติ"></a><select id="menuLanguage" class="menu-lang" data-menu-lang-select aria-label="Language"><option value="th">TH</option><option value="en">EN</option><option value="zh">中文</option><option value="lo">ລາວ</option><option value="vi">VI</option><option value="ja">日本語</option><option value="ko">한국어</option></select></div>
<div class="brand" data-menu-i18n="brand">ตำมา-ชาติ</div>
<div class="sub" data-menu-i18n="sub">เมนูจริง · อัปเดตจากวัตถุดิบและสต๊อกของร้าน</div>
<div class="truth" data-menu-i18n="truth">● Source of Truth — ราคาและสถานะเมนูจากหลังบ้านเดียวกัน</div>
</header>
<div class="bar"><div id="status" class="status" data-menu-i18n="loading">กำลังโหลดเมนูล่าสุด…</div><a class="chat" href="./"><span data-menu-i18n="chat">คุยกับทองไทย / สั่งล่วงหน้า</span><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M13 6l6 6-6 6" stroke-linecap="round" stroke-linejoin="round"/></svg></a></div>
<div id="menu" class="categories" aria-live="polite"></div>
<div class="foot" id="menuFoot"></div>
</main>
<script src="assets/scripts/menu-i18n.js"></script>
<script>
const root=document.getElementById('menu'),statusEl=document.getElementById('status'),footEl=document.getElementById('menuFoot');
const mt=(k,v={})=>window.MenuI18n?.t(k,v)||k;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let lastMenuData=null;
function renderFoot(){footEl.innerHTML=esc(mt('foot')).replace('|','<br>')}
function render(data){
 lastMenuData=data;
 const groups=new Map();
 for(const item of data.items||[]){if(!groups.has(item.category_name))groups.set(item.category_name,[]);groups.get(item.category_name).push(item)}
 root.innerHTML='';
 for(const [category,items] of groups){
   const section=document.createElement('section');section.className='category';section.innerHTML=`<h2>${esc(MenuI18n.category(category))}</h2>`;
   for(const item of items){
     const el=document.createElement('article');el.className='item '+(item.is_orderable?'':'sold');
     const ingredients=(item.ingredient_names||[]).slice(0,8).map(MenuI18n.ingredient).join(' · ');
     const unavailable=(item.unavailable_ingredients||[]).map(MenuI18n.ingredient).join(', ');
     el.innerHTML=`<div class="top"><div class="name">${esc(MenuI18n.name(item.name))} ${item.is_signature?'<span class="star">★</span>':''}</div><div class="price">${Number(item.selling_price).toLocaleString(MenuI18n.locale(),{maximumFractionDigits:0})} ฿</div></div><div class="meta">${esc(mt('main_ingredients'))}: ${esc(ingredients||'—')}</div>${item.is_orderable?`<span class="badge ok">${esc(mt('ready'))}</span>`:`<span class="badge no">${esc(mt('sold_out'))}${unavailable?' · '+esc(unavailable):''}</span>`}`;
     section.appendChild(el)
   }
   root.appendChild(section)
 }
 const updated=new Date(data.updatedAt);
 const time=Number.isNaN(updated.valueOf())?mt('backoffice'):updated.toLocaleString(MenuI18n.locale(),{dateStyle:'medium',timeStyle:'short'});
 statusEl.textContent=mt('count',{count:data.count||0})+' · '+mt('updated',{time});
 renderFoot();
}
async function load(){
 statusEl.textContent=mt('loading');root.innerHTML='';
 try{const r=await fetch('/.netlify/functions/restaurant-menu',{cache:'no-store'});if(!r.ok)throw new Error('load');render(await r.json())}
 catch(e){statusEl.textContent=mt('load_failed');root.innerHTML=`<div class="empty">${esc(mt('unavailable'))}<br><br><button class="retry" type="button">${esc(mt('retry'))}</button></div>`;root.querySelector('button').addEventListener('click',load)}
}
window.addEventListener('menu:i18n-ready',()=>{renderFoot();if(lastMenuData)render(lastMenuData)});
window.addEventListener('menu:i18n-change',()=>{renderFoot();if(lastMenuData)render(lastMenuData);else load()});
renderFoot();load();
</script>
</body>
</html>
